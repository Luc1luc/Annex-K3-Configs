#####################################################################
#   Includes
#####################################################################

[include mainsail.cfg]
[include movement.cfg]
[include sensorless.cfg]
[include macros.cfg]
[include config_backup.cfg]
[include K-ShakeTune/*.cfg]
#[include adxl.cfg]
[include tmc_autotune.cfg]

#####################################################################
#   Printer Core
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_26001A000651313433343333-if00

restart_method: command

[virtual_sdcard]

path: ~/printer_data/gcodes/
on_error_gcode:
    SAVE_GCODE_STATE NAME=on_error_gcode
    G91
    G1 Z10 F6000
    RESTORE_GCODE_STATE NAME=on_error_gcode

[printer]
kinematics: cartesian
max_velocity: 500 
max_accel: 25000
max_z_velocity: 10
max_z_accel: 1500
square_corner_velocity: 5

[input_shaper]
shaper_type: mzv
shaper_freq_x: 73.8
shaper_freq_y: 73.2

[idle_timeout]
timeout: 18000

[force_move]
enable_force_move: True

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 3
show_macros_in_webui: True
timeout: 300


#####################################################################
#   Toolhead
#####################################################################
#-----------------------------------
#   Extruder
#-----------------------------------
[extruder]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
rotation_distance: 22.54086 #CNC Hextrudort
#rotation_distance: 23.238 #CNC Sherpa Mini
gear_ratio: 6.25:1 #CNC Sherpa Mini | CNC Hextrudort
microsteps: 32
full_steps_per_rotation: 200
pwm_cycle_time: 0.010
nozzle_diameter: 0.5
filament_diameter: 1.75
heater_pin: PA0
sensor_type: PT1000
pullup_resistor: 2200
sensor_pin: PB0
min_temp: 1
max_temp: 320
max_power: 1.0
min_extrude_temp: 1
control: pid_v
pid_Kp: 25.416
pid_Ki: 1.554
pid_Kd: 103.886
pressure_advance: 0
pressure_advance_smooth_time: 0.04


[tmc2240 extruder]
cs_pin: PG14
spi_software_sclk_pin: PG8
spi_software_miso_pin: PG7
spi_software_mosi_pin: PG6
interpolate: false
run_current: 0.6
stealthchop_threshold: 0
rref: 12000


#---------------
#   Fans
#---------------

##  Hotend Fan - FAN0
[heater_fan hotend_fan]
pin: PF7
max_power: 1.0
fan_speed: 1.0
kick_start_time: 0.4
cycle_time: 0.01
heater: extruder
heater_temp: 60.0

## Part Fan - FAN1
[fan]
pin: PF9
min_power: 0.05
max_power: 0.8
kick_start_time: 0.2
cycle_time: 0.005

#----------------------------
#   Probe
#----------------------------

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_FC003D334E5737374D202020FF112D2D-if00 
speed: 8
lift_speed: 10
backlash_comp: 0.5
x_offset: -25
y_offset:  0
contact_max_hotend_temperature: 185 # increase to probe at print temps
home_xy_position: 35, 35 # update with your safe position
home_gcode_pre_x: _PRE_HOME_X
home_gcode_post_x: _POST_HOME_X
home_gcode_pre_y: _PRE_HOME_Y
home_gcode_post_y: _POST_HOME_Y
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: contact
home_method_when_homed: proximity
home_autocalibrate: always
trigger_distance: 2.
trigger_dive_threshold: 1.
trigger_hysteresis: 0.006  # Hysteresis on trigger threshold for untriggering, as a percentage of the trigger threshold.
cal_nozzle_z: 0.1
cal_floor: 0.2
cal_ceil: 5.
cal_speed: 1.
cal_move_speed: 20
default_model_name: default
mesh_main_direction: x
mesh_cluster_size: 1
mesh_runs: 2


[resonance_tester]
accel_chip: beacon
probe_points: 90, 90, 50
accel_per_hz: 75


#####################################################################
#   Bed Heater
#####################################################################
[heater_bed]
heater_pin: PA1
sensor_type: PT1000
sensor_pin: PC5
pullup_resistor: 2200
max_power: 1
min_temp: 0
max_temp: 135
control: pid_v
pid_Kp=40.000
pid_Ki=0.500
pid_Kd=250.000

[bed_mesh]
speed: 250
horizontal_move_z: 10
mesh_min: 35, 35
mesh_max: 145, 145
probe_count: 15, 15
mesh_pps: 3, 3
algorithm: bicubic
bicubic_tension: 0.2
move_check_distance: 3
split_delta_z: .025

[z_tilt]
z_positions:
    -75, -20
    75, 220
    220, -20
    
points:
    50, 20
    120, 140
    160, 20
    
speed: 250
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.008

[verify_heater heater_bed]
max_error: 120
#   The maximum "cumulative temperature error" before raising an error. Smaller values result in stricter checking and larger values allow for more time before an error is reported. Specifically, the temperature is inspected once a second and if it
#   is close to the target temperature then an internal "error counter" is reset; otherwise, if the temperature is below the target range then the counter is increased by the amount the reported temperature differs from that range. Should the counter
#   exceed this "max_error" then an error is raised. The default is 120.
check_gain_time: 120
#   This controls heater verification during initial heating. Smaller values result in stricter checking and larger values allow for more time before an error is reported. Specifically, during initial heating, as long as the heater increases in temperature
#   within this time frame (specified in seconds) then the internal "error counter" is reset. The default is 20 seconds for extruders and 60 seconds for heater_bed.
hysteresis: 2
#   The maximum temperature difference (in Celsius) to a target temperature that is considered in range of the target. This controls the max_error range check. It is rare to customize this value. The default is 5.
heating_gain: 1
#   The minimum temperature (in Celsius) that the heater must increase by during the check_gain_time check. It is rare to customize this value. The default is 2.

#####################################################################
#   Electronics Bay
#####################################################################

[temperature_sensor CM4]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor Manta]
sensor_type: temperature_mcu
min_temp: 10
max_temp: 100

[temperature_sensor Chamber]
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
min_temp: 0
max_temp: 115

[temperature_sensor Chamber_Toolhead]
sensor_type: Generic 3950
sensor_pin: PA7
min_temp: 0
max_temp: 115

## Electrics Fan - FAN4
[multi_pin electronic_fans]
pins: PF8,PA4
[controller_fan Electronic_Fan]
pin: multi_pin:electronic_fans
max_power: 1.0
kick_start_time: 1.5
cycle_time: 0.01

[output_pin caselight] 
pin: PA3 
pwm: True 
value: 0 
cycle_time: 0.001 
hardware_pwm: False

#####################################################################
#   Input Shaping
#####################################################################

[gcode_shell_command plot_graph]
command: bash /home/pi/printer_data/config/scripts/plot_graphs.sh
timeout: 500.0
verbose: True

#####################################################################
#   MISC
#####################################################################

[exclude_object]
